name: Smart Asset Discovery

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Thema oder Szene, für die viele Bilder und B-Rolls gesucht werden sollen"
        required: true
        type: string
      orientation:
        description: "Bevorzugtes Format"
        required: true
        default: vertical
        type: choice
        options:
          - vertical
          - horizontal
          - square
          - any
      media_type:
        description: "Welche Assets?"
        required: true
        default: both
        type: choice
        options:
          - both
          - video
          - photo
      queries:
        description: "Automatische Suchrichtungen"
        required: true
        default: "8"
        type: choice
        options:
          - "6"
          - "8"
          - "10"
          - "12"
          - "16"
      pages:
        description: "Pexels-Seiten pro Suchrichtung und Medientyp"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
      per_page:
        description: "Treffer pro API-Anfrage"
        required: true
        default: "30"
        type: choice
        options:
          - "20"
          - "30"
          - "40"
          - "60"
          - "80"
      top:
        description: "Wie viele gerankte Kandidaten speichern?"
        required: true
        default: "80"
        type: choice
        options:
          - "40"
          - "60"
          - "80"
          - "100"
          - "150"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API }}

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js 22 verwenden
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: API-Schlüssel prüfen
        shell: bash
        run: |
          if [ -z "$PEXELS_API_KEY" ]; then
            echo "GitHub Secret PEXELS_API fehlt. Unter Settings > Secrets and variables > Actions anlegen."
            exit 1
          fi

      - name: Viele Bilder und B-Rolls entdecken
        shell: bash
        run: |
          npm run discover -- \
            "${{ inputs.topic }}" \
            --type "${{ inputs.media_type }}" \
            --orientation "${{ inputs.orientation }}" \
            --queries "${{ inputs.queries }}" \
            --pages "${{ inputs.pages }}" \
            --per-page "${{ inputs.per_page }}" \
            --top "${{ inputs.top }}"

      - name: Discovery-Ergebnisse bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: visual-asset-discovery
          path: .local-storage/discovery/
          if-no-files-found: error
          retention-days: 14
