name: Render 2-Minute Demo Video

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "renderer/src/DemoVideo.tsx"
      - "renderer/src/Root.tsx"
      - "renderer/src/index.ts"
      - "renderer/package.json"
      - ".github/workflows/render-demo-video.yml"

permissions:
  contents: write

concurrency:
  group: render-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: production-v1
          lfs: false
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install renderer dependencies
        working-directory: renderer
        run: npm install --no-audit --no-fund

      - name: Typecheck renderer
        working-directory: renderer
        run: npm run check

      - name: Render 120-second MP4
        working-directory: renderer
        run: npm run render:demo

      - name: Verify output
        run: |
          test -s renderer/out/visual-asset-hub-demo-2min.mp4
          ls -lh renderer/out/visual-asset-hub-demo-2min.mp4

      - name: Save rendered video to branch
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p demo-output
          cp renderer/out/visual-asset-hub-demo-2min.mp4 demo-output/visual-asset-hub-demo-2min.mp4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo-output/visual-asset-hub-demo-2min.mp4
          if git diff --cached --quiet; then
            echo "Rendered video unchanged."
          else
            git commit -m "test: add rendered 2-minute demo video"
            git push origin HEAD:production-v1
          fi
