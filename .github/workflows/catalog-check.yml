name: Catalog Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: visual-asset-hub-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Node.js 22 verwenden
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Syntax, Katalog, Index und Tests prüfen
        run: npm run check
      - name: Generierten Index prüfen
        run: git diff --exit-code -- catalog/search-index.json
      - name: Katalogbericht erzeugen
        run: npm run report
      - name: Bericht bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: katalogbericht-${{ github.run_id }}
          path: reports/
          retention-days: 7
