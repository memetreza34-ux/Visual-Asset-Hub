name: Pexels suchen

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Wonach soll gesucht werden?"
        required: true
        type: string
      media_type:
        description: "Fotos oder Videos"
        required: true
        default: video
        type: choice
        options: [video, photo]
      orientation:
        description: "Format"
        required: true
        default: vertical
        type: choice
        options: [vertical, horizontal, square, any]
      page:
        description: "Ergebnisseite"
        required: true
        default: "1"
        type: choice
        options: ["1", "2", "3", "4", "5"]
      per_page:
        description: "Anzahl der Ergebnisse"
        required: true
        default: "20"
        type: choice
        options: ["10", "20", "40", "80"]

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API || secrets.PEXELS_API_KEY }}
      INPUT_QUERY: ${{ inputs.query }}
      INPUT_TYPE: ${{ inputs.media_type }}
      INPUT_ORIENTATION: ${{ inputs.orientation }}
      INPUT_PAGE: ${{ inputs.page }}
      INPUT_PER_PAGE: ${{ inputs.per_page }}
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Node.js 22 verwenden
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: API-Schlüssel prüfen
        run: test -n "$PEXELS_API_KEY" || (echo "GitHub Secret PEXELS_API fehlt" && exit 1)
      - name: Pexels durchsuchen
        shell: bash
        run: |
          ARGS=(--query "$INPUT_QUERY" --type "$INPUT_TYPE" --page "$INPUT_PAGE" --per-page "$INPUT_PER_PAGE" --output .local-storage/pexels-search/results.json)
          if [ "$INPUT_ORIENTATION" != "any" ]; then ARGS+=(--orientation "$INPUT_ORIENTATION"); fi
          npm run pexels:search -- "${ARGS[@]}"
      - name: Visuelle Galerie erzeugen
        run: npm run pexels:gallery -- --input .local-storage/pexels-search/results.json --output .local-storage/pexels-search/gallery.html
      - name: Suchergebnisse bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: pexels-${{ inputs.media_type }}-${{ github.run_id }}
          path: .local-storage/pexels-search/
          if-no-files-found: error
          retention-days: 7
