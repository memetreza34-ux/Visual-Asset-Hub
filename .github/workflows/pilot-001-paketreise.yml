name: Pilot 001 - Paketreise

on:
  push:
    branches:
      - pilot/001-paketreise
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API }}
      PILOT_DIR: pilots/001-paketreise
      OUTPUT_DIR: .local-storage/pilot-001
      PROJECT_OUT: .local-storage/pilot-001/project/001-paketreise
      VIDEO_TITLE: Was passiert mit deinem Paket nach dem Klick auf Bestellen?
      COVER_TEXT: SO REIST DEIN PAKET

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js 22 verwenden
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: FFmpeg bereitstellen
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Visual Plan erstellen
        shell: bash
        run: |
          mkdir -p "$OUTPUT_DIR"
          npm run visual:plan -- \
            --file "$PILOT_DIR/01-script/voice-script.txt" \
            --orientation horizontal \
            --max-words-per-beat 10 \
            --output "$OUTPUT_DIR/visual-plan.json"

      - name: Flow Prompt + striktes Pilot-Gate
        shell: bash
        run: |
          npm run flow:compile -- \
            --plan "$OUTPUT_DIR/visual-plan.json" \
            --title "$VIDEO_TITLE" \
            --cover-text "$COVER_TEXT" \
            --target-duration 120 \
            --pilot-strict true \
            --block-size 5 \
            --output-dir "$OUTPUT_DIR/flow"

      - name: Echte Bewegungs-B-Rolls auflösen
        shell: bash
        run: |
          if [ -z "$PEXELS_API_KEY" ]; then
            echo "PEXELS_API Secret fehlt; Real-Media-Auflösung wird transparent als nicht ausgeführt markiert."
            mkdir -p "$OUTPUT_DIR/real-media"
            printf '%s\n' '{"status":"not-run","reason":"PEXELS_API secret missing"}' > "$OUTPUT_DIR/real-media/pilot-real-media-status.json"
          else
            npm run real:integrate -- \
              --queue "$OUTPUT_DIR/real-material-queue.json" \
              --output-dir "$OUTPUT_DIR/real-media" \
              --queries 3 \
              --pages 2 \
              --per-page 30 \
              --max-dimension 1920
          fi

      - name: Pilot-Zusammenfassung
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const base = '.local-storage/pilot-001';
          const plan = JSON.parse(fs.readFileSync(`${base}/visual-plan.json`, 'utf8'));
          const ready = JSON.parse(fs.readFileSync(`${base}/flow/pilot-readiness.json`, 'utf8'));
          const realPath = `${base}/real-media/real-media-resolution.json`;
          const real = fs.existsSync(realPath) ? JSON.parse(fs.readFileSync(realPath, 'utf8')) : null;
          const summary = {
            pilot: '001-paketreise',
            title: 'Was passiert mit deinem Paket nach dem Klick auf Bestellen?',
            cover_text: 'SO REIST DEIN PAKET',
            readiness: ready.status,
            metrics: ready.metrics,
            visual_summary: plan.summary,
            real_media_summary: real?.summary ?? null,
            next_gate: 'Google Flow: generate exactly 3 cover candidates, user selects one, then Stage 2.'
          };
          fs.writeFileSync(`${base}/pilot-run-summary.json`, JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Kanalartige Projektstruktur materialisieren
        shell: bash
        run: |
          rm -rf "$PROJECT_OUT"
          mkdir -p \
            "$PROJECT_OUT/00-bildprompts/cover" \
            "$PROJECT_OUT/00-bildprompts/images" \
            "$PROJECT_OUT/01-script" \
            "$PROJECT_OUT/02-audio" \
            "$PROJECT_OUT/03-bilder/ki" \
            "$PROJECT_OUT/03-bilder/real-broll" \
            "$PROJECT_OUT/04-export" \
            "$PROJECT_OUT/99-tech"

          cp "$PILOT_DIR/README.md" "$PROJECT_OUT/README.md"
          cp "$PILOT_DIR/01-script/voice-script.txt" "$PROJECT_OUT/01-script/voice-script.txt"
          cp "$PILOT_DIR/00-bildprompts/99-alle-bildprompts.txt" "$PROJECT_OUT/00-bildprompts/99-alle-bildprompts.txt"
          cp "$PILOT_DIR/00-bildprompts/cover/cover-A.txt" "$PROJECT_OUT/00-bildprompts/cover/cover-A.txt"
          cp "$PILOT_DIR/00-bildprompts/cover/cover-B.txt" "$PROJECT_OUT/00-bildprompts/cover/cover-B.txt"
          cp "$PILOT_DIR/00-bildprompts/cover/cover-C.txt" "$PROJECT_OUT/00-bildprompts/cover/cover-C.txt"
          cp "$OUTPUT_DIR/flow/google-flow-master-prompt.txt" "$PROJECT_OUT/00-bildprompts/google-flow-master-prompt.txt"

          cp "$OUTPUT_DIR/visual-plan.json" "$PROJECT_OUT/99-tech/visual-plan.json"
          cp "$OUTPUT_DIR/scene-cards.json" "$PROJECT_OUT/99-tech/scene-cards.json"
          cp "$OUTPUT_DIR/ai-generation-queue.json" "$PROJECT_OUT/99-tech/ai-generation-queue.json"
          cp "$OUTPUT_DIR/real-material-queue.json" "$PROJECT_OUT/99-tech/real-material-queue.json"
          cp "$OUTPUT_DIR/flow/flow-production-plan.json" "$PROJECT_OUT/99-tech/flow-production-plan.json"
          cp "$OUTPUT_DIR/flow/flow-generation-queue.json" "$PROJECT_OUT/99-tech/flow-generation-queue.json"
          cp "$OUTPUT_DIR/flow/pilot-readiness.json" "$PROJECT_OUT/99-tech/pilot-readiness.json"
          cp "$OUTPUT_DIR/pilot-run-summary.json" "$PROJECT_OUT/99-tech/pilot-run-summary.json"
          cp "$PILOT_DIR/99-tech/pilot.json" "$PROJECT_OUT/99-tech/pilot.json"

          if [ -f "$OUTPUT_DIR/real-media/real-media-resolution.json" ]; then
            cp "$OUTPUT_DIR/real-media/real-media-resolution.json" "$PROJECT_OUT/99-tech/real-media-resolution.json"
          fi
          if [ -f "$OUTPUT_DIR/real-media/remotion-real-media.json" ]; then
            cp "$OUTPUT_DIR/real-media/remotion-real-media.json" "$PROJECT_OUT/99-tech/remotion-real-media.json"
          fi
          if compgen -G "$OUTPUT_DIR/real-media/files/*" > /dev/null; then
            cp "$OUTPUT_DIR"/real-media/files/* "$PROJECT_OUT/03-bilder/real-broll/"
          fi

          printf '%s\n' '{"status":"READY_FOR_GOOGLE_FLOW_COVER_TEST","next_action":"Generate cover A/B/C and wait for user selection"}' > "$PROJECT_OUT/99-tech/status.json"

      - name: Struktur prüfen
        shell: bash
        run: |
          test -f "$PROJECT_OUT/00-bildprompts/cover/cover-A.txt"
          test -f "$PROJECT_OUT/00-bildprompts/cover/cover-B.txt"
          test -f "$PROJECT_OUT/00-bildprompts/cover/cover-C.txt"
          test -f "$PROJECT_OUT/00-bildprompts/99-alle-bildprompts.txt"
          test -f "$PROJECT_OUT/01-script/voice-script.txt"
          test -f "$PROJECT_OUT/99-tech/pilot-readiness.json"
          echo "Projektstruktur vollständig."

      - name: Pilot-Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: pilot-001-paketreise-project
          path: .local-storage/pilot-001/project/001-paketreise/
          if-no-files-found: error
          retention-days: 14
