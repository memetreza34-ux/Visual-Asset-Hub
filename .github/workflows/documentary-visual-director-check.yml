name: Documentary Visual Director Check

on:
  push:
    branches: [agent/beta-release]
  pull_request:
    branches: [main]

jobs:
  documentary-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check new documentary modules
        run: |
          node --check scripts/documentary-research-v2.mjs
          node --check scripts/documentary-research-v3.mjs
          node --check scripts/documentary-materialize-v2.mjs
          node --check scripts/documentary-phase3-v2.mjs
          node --check scripts/documentary-phase3-validate-v2.mjs
          node --check scripts/documentary-render-v2.mjs
          node --check scripts/lib/documentary-vision-rerank.mjs
          node --check scripts/lib/nasa-media.mjs
          node --check scripts/lib/loc-media.mjs
      - name: Run visual director tests
        run: node --test tests/documentary-visual-director-v2.test.mjs
