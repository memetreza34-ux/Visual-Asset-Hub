name: AI-first Asset Pipeline

on:
  workflow_dispatch:
    inputs:
      narration:
        description: "Sprechertext oder Szenentext"
        required: true
        type: string
      title:
        description: "Videotitel für den Flow-Master-Prompt"
        required: true
        type: string
      cover_text:
        description: "Exakter deutscher Cover-Text für Bild 01"
        required: true
        type: string
      orientation:
        description: "Zielformat"
        required: true
        default: horizontal
        type: choice
        options:
          - horizontal
          - vertical
          - square
      max_words_per_beat:
        description: "Bilddichte: kleinere Zahl = mehr echte Story-Bilder"
        required: true
        default: "16"
        type: choice
        options:
          - "10"
          - "12"
          - "14"
          - "16"
          - "20"
      pages:
        description: "Pexels-Seiten je Real-Media-Suchrichtung"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      per_page:
        description: "Pexels-Treffer je Anfrage"
        required: true
        default: "30"
        type: choice
        options:
          - "20"
          - "30"
          - "40"
          - "60"
      real_queries:
        description: "Suchrichtungen je Real-Beat"
        required: true
        default: "3"
        type: choice
        options:
          - "2"
          - "3"
          - "4"
          - "5"

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API }}
      NARRATION: ${{ inputs.narration }}
      VIDEO_TITLE: ${{ inputs.title }}
      COVER_TEXT: ${{ inputs.cover_text }}
      TARGET_ORIENTATION: ${{ inputs.orientation }}
      MAX_WORDS_PER_BEAT: ${{ inputs.max_words_per_beat }}
      REAL_QUERIES: ${{ inputs.real_queries }}
      SEARCH_PAGES: ${{ inputs.pages }}
      SEARCH_PER_PAGE: ${{ inputs.per_page }}

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js 22 verwenden
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pexels-Key prüfen
        shell: bash
        run: |
          if [ -z "$PEXELS_API_KEY" ]; then
            echo "GitHub Secret PEXELS_API fehlt."
            exit 1
          fi

      - name: AI-first Visual Plan V2 erstellen
        shell: bash
        run: |
          mkdir -p .local-storage/pipeline
          npm run visual:plan -- \
            --text "$NARRATION" \
            --orientation "$TARGET_ORIENTATION" \
            --max-words-per-beat "$MAX_WORDS_PER_BEAT" \
            --output .local-storage/pipeline/visual-plan.json

      - name: Google Flow Production Prompt kompilieren
        shell: bash
        run: |
          npm run flow:compile -- \
            --plan .local-storage/pipeline/visual-plan.json \
            --title "$VIDEO_TITLE" \
            --cover-text "$COVER_TEXT" \
            --block-size 5 \
            --output-dir .local-storage/pipeline/flow

      - name: Echte Bilder und B-Rolls suchen und herunterladen
        shell: bash
        run: |
          npm run real:integrate -- \
            --queue .local-storage/pipeline/real-material-queue.json \
            --output-dir .local-storage/pipeline/real-media \
            --queries "$REAL_QUERIES" \
            --pages "$SEARCH_PAGES" \
            --per-page "$SEARCH_PER_PAGE"

      - name: Pipeline-Ergebnis bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: ai-first-video-assets
          path: .local-storage/pipeline/
          if-no-files-found: error
          retention-days: 14
